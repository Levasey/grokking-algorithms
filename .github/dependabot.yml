version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      junit:
        patterns:
          - "org.junit.jupiter:*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "org.jacoco:*"
          - "com.github.spotbugs:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
